[package]
name = "axle-tui"
version = "0.1.0"
edition = "2024"
description = "A lightweight, terminal-driven Windows Driver Manager in Rust"
authors = ["Sameer Mukhtar"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/maskarajr/Axle"
readme = "README.md"
keywords = ["windows", "driver", "tui", "ratatui", "wua"]
categories = ["rust", "cli", "utilities", "drivers", "os::windows-apis"]
include = [
    "src/**/*",
    "scripts/**/*",
    "build.rs",
    "app_icon.ico",
    "Cargo.toml",
    "README.md",
    "LICENSE"
]

[[bin]]
name = "axle-tui"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winres= "0.1"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17" # For headless CLI spinners/progress